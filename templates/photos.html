<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Photos - SecureSnap</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="photos-container">

    <h1>Browse Photos</h1>

    <p>
        Welcome, {{ current_user.username }}!
        Discover high-quality stock photos.
    </p>

    <div class="photo-grid">

        {% for photo in photos %}

        <div class="photo-card">

            <img src="{{ photo.image_url }}"
                 alt="{{ photo.title }}">

            <div class="photo-card-content">

                <h2>{{ photo.title }}</h2>

                <p class="price">
                    ${{ "%.2f"|format(photo.price) }}
                </p>

                <a href="{{ url_for('photo_detail', photo_id=photo.id) }}"
                   class="btn">
                    View Photo
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

    <br>

    <a href="{{ url_for('logout') }}" class="btn">
        Logout
    </a>

</div>

</body>
</html>
